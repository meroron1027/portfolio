<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - 拭っ斬れろ！ぞうきん侍</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="work-detail-body preload">

    <div class="work-detail-wrapper">
        <!-- 左側コンテンツ -->
        <div class="work-detail-left">
            <!-- 拡大縮小トグル用ボタン -->
            <div class="work-detail-toggle"></div>

            <!-- 幾何学的な装飾 -->
            <div class="work-detail-decor"></div>

            <div class="work-detail-content">
                <p class="work-category">Game / Interactive</p>
                <h1 class="work-detail-title">拭っ斬れろ！ぞうきん侍</h1>

                <div class="work-detail-info">
                    <p><strong>Focus</strong> Game Design / Device</p>
                    <p><strong>Date</strong> 2026.07</p>
                    <p><strong>Tools</strong> Unity, Python, Illustrator</p>
                    <p class="work-detail-desc">
                        卒業制作として、ぞうきんをコントローラーにした2D剣術アクションゲームを制作しています。センサーを仕込んだぞうきんで机を拭くと、画面の侍が刀を振る仕組みです。「修行（雑巾がけ）」がそのまま「実践（剣術）」につながる、日常の動作を遊びに変える体験を目指しています。（仮題・制作中）
                    </p>
                </div>

                <div class="work-detail-actions">
                    <a href="index.html#works" class="btn-back">← Back to Works</a>
                    <a href="https://docs.google.com/presentation/d/1s_UzceVkTeyDwy7W-9GUpbGNmQB5maSyBROWjBwXqMs/edit?usp=sharing"
                        target="_blank" class="btn-primary">View
                        Project</a>
                </div>
            </div>
        </div>

        <!-- 右側ビジュアル -->
        <div class="work-detail-right">
            <video src="img/work2.mp4" autoplay loop muted playsinline></video>
        </div>
    </div>

    <script>
        // ====== Portfolio Detail PC Expansion ======
        const workDetailBody = document.querySelector('.work-detail-body');
        if (workDetailBody) {
            const detailRight = document.querySelector('.work-detail-right');
            const toggleBtn = document.querySelector('.work-detail-toggle');

            function toggleExpand() {
                if (window.innerWidth >= 769) { // PC版のみ動作
                    workDetailBody.classList.toggle('is-expanded');
                }
            }

            if (detailRight) {
                detailRight.addEventListener('click', toggleExpand);
            }
            if (toggleBtn) {
                // ボタンのクリックイベント（バブリングを防ぐ）
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleExpand();
                });
            }
        }
    </script>
</body>

</html>
